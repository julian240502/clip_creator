[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Le bloc <style> intégré à l'UI contient de longues lignes CSS.
"app.py" = ["E501"]
